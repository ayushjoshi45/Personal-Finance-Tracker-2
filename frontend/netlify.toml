[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to Render (same-origin for cookies in production)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-NAME.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/transaction/*"
  to = "https://YOUR-BACKEND-NAME.onrender.com/transaction/:splat"
  status = 200
  force = true

# React Router SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
