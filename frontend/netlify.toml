[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://personal-finance-tracker-2-mx43.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/transaction/*"
  to = "https://personal-finance-tracker-2-mx43.onrender.com/transaction/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
