[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to Render (same-origin for cookies in production)
[[redirects]]
  from = "/api/v1/user/*"
  to = "https://personal-finance-tracker-2-mx43.onrender.com/api/v1/user/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/transaction/*"
  to = "https://personal-finance-tracker-2-mx43.onrender.com/transaction/:splat"
  status = 200
  force = true

# React Router SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
